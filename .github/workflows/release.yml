name: Build Windows distribution
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  QINGJIAN_UIACCESS: '0'
  NO_PROXY: localhost,127.0.0.1,::1
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.96.0
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Fetch verified product data
        shell: pwsh
        run: ./tools/fetch-data.ps1
      - name: Test shipped packages
        run: cargo test --release --locked -p qingjian-core -p qingjian-platform -p qingjian-predict -p qingjian-update -p qingjian-windows-server -p qingjian-windows-tsf -p qingjian-settings
      - name: Build installer and source snapshot
        shell: pwsh
        run: ./apps/windows/installer/build-ctrllingo.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: CtrlLingo-windows-distribution
          path: |
            target/ctrllingo-release/*.exe
            target/ctrllingo-release/*.zip
            target/ctrllingo-release/*.txt
          if-no-files-found: error
