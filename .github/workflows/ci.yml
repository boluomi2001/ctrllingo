name: Windows CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  QINGJIAN_UIACCESS: '0'
  NO_PROXY: localhost,127.0.0.1,::1
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p qingjian-core -p qingjian-platform -p qingjian-predict -p qingjian-update -p qingjian-learning -p qingjian-windows-server -p qingjian-windows-tsf -p qingjian-settings --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test -p qingjian-core -p qingjian-platform -p qingjian-predict -p qingjian-update -p qingjian-learning -p qingjian-windows-server -p qingjian-windows-tsf -p qingjian-settings --locked
      - name: Check 32-bit TSF
        run: cargo check -p qingjian-windows-tsf --target i686-pc-windows-msvc --locked
