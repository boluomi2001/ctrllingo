name: 功能建议
description: 提出 CtrlLingo · 译点的功能或改进建议
title: "[建议] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 issue。当前发布目标是 Windows；其他平台仍属于上游源码范围，尚无译点发布验收。
  - type: textarea
    id: problem
    attributes:
      label: 你希望解决什么问题？
      description: 请描述实际场景，以及目前遇到的限制。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你期待怎样的行为？
      description: 可以描述交互方式、输入和预期结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代做法
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 补充背景
      description: 请勿包含 API 密钥、私人输入或其他敏感信息。
    validations:
      required: false
