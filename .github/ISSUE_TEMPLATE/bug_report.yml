name: 缺陷报告
description: 报告 CtrlLingo · 译点中可复现的问题
title: "[缺陷] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 issue。提交前请移除 API 密钥、私人输入、账户信息和完整日志。
  - type: input
    id: version
    attributes:
      label: CtrlLingo 版本
      description: 可在“关于”页面或安装包信息中查看。
      placeholder: 例如 0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2
    validations:
      required: true
  - type: input
    id: application
    attributes:
      label: 出问题的应用
      description: 请注明应用名称，以及它是 32 位还是 64 位（如果知道）。
      placeholder: 例如 记事本（64 位）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序描述操作和输入内容；请使用不含隐私的示例文本。
      placeholder: |
        1. 切换到 CtrlLingo
        2. 输入……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 其他信息
      description: 可附不含敏感数据的截图、相关设置或错误提示。不要上传未经检查的输入日志或配置文件。
    validations:
      required: false
